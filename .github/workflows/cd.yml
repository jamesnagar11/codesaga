name: Continuous Integration and Deployment 
on:
    push:
        branches: [ main ]

jobs:
    build:
        runs-on: ubuntu@latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v2

            - name: Docker login
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}
            - name: Docker Buildx
              uses: docker/setup-buildx-action@v2
            
            - name: Build and push
              uses: docker/build-push-action@v4
              with:
                context: .
                file: Dockerfile
                push: true
                tags: jamesnagar/codesaga-client:${{ github.sha }}
                build-args:
                    DATABASE_URL=${{ secrets.STAGING_DATABASE }}
            
            - name: Clone staging-ops repo, update and push
              env:  
                    PAT: ${{ secrets.PAT_GITHUB }}
              run: |
                git clone https://github.com/jamesnagar11/staging-ops.git
                cd staging-ops
                sed -i 's|image: jamesnagar/codesaga-client:.*|image: jamesnagar/codesaga-client:${{ github.sha }}|' staging/codesaga/client/manifest.yaml
                git config user.name "GitHub Actions Bot"
                git config user.email "actions@github.com"
                git add staging/codesaga/client/manifest.yaml
                git commit -m "Update codesaga-client image to ${{ github.sha }}"
                git push https://${PAT}@github.com/jamesnagar11/staging-ops.git main


